conclusions:
- Intrinsics are not the limiting factor (factory 0.245 px held-out reprojection).
- The marker or board position still scatters 3 to 14 mm between camera poses; a rigid hand-eye offset does not explain it. Arm kinematics (tool
  pose from the joint angles) is the untested leading suspect.
- Plan pipelines around a few millimetres of view-to-view inconsistency.
